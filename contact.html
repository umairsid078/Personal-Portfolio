<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

  <div id="wrapper">

    <header>

      <div id="leftSection">
        Personal Portfolio
      </div>

      <div id="rightSection">

        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact Me</a></li>
          </ul>
        </nav>

      </div>

</header>

    <main>

      <section id="contactCard">

        <h2> Contact Me! </h2>

        <p>Fill out the form below to contact me.</p>

        <form>

          <p>
            <label for="name">Name: </label>
            <br>
            <input type="text" id="name" name="name" required>
          </p>

          <p>
            <label for="email">Email: </label>
            <br>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="phone">Cell Number: </label>
            <br>
            <input type="tel" id="phone" name="phone"
                   pattern="[0-9]{10}" required>
          </p>

          <p>
            <label for="comments">Any Comments :</label>
            <br>
            <textarea id="comments" name="comments" rows="6" required></textarea>
          </p>

          <p>
            <input type="submit" value="Submit">
          </p>

        </form>

      </section>

    </main>

    <footer>
      <p>Email: umair.siddiqui2@ontariotechu.net</p>
      <p>&copy; 2026 Umair Siddiqui</p>
    </footer>

  </div>

</body>

</html>
